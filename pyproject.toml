[project]
name = "faster-whisper-gui-app"
version = "0.1.0"
description = "A powerful desktop GUI application for accurate audio/video transcription using OpenAI's Whisper model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "faster-whisper>=1.0.0",
    "ctranslate2==4.4.0",
    "tokenizers>=0.13.0",
    "huggingface-hub>=0.21.0",
    "onnxruntime>=1.14.0",
    "psutil>=5.9.0",
    "soundfile==0.13.1",
    "librosa>=0.10.0",
    "python-docx>=0.8.11",
    "cryptography>=46.0.4,<47",
    "wmi>=1.5.1",
    "pywin32>=311",
    "ntplib>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "*.py",
    "assets",
    "Resource",
    "*.spec"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Build-time only (not needed to run the app): uv sync --extra build
build = ["pyinstaller>=6.0.0", "pyarmor==9.2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
